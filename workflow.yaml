# LWF 工作流定义 — ai-briefing
# 采集 → LLM 精选 → Git 桥存储 → 邮件推送
name: ai-briefing
trigger:
  schedule: "0 7 * * *"        # 每天 UTC 7:00（北京时间 15:00）

bridge:
  repo: sunzcdev/data-bridge
  path: ai-briefing/

steps:
  # ── 第一步：采集 ──
  - id: collect
    runner: gha
    capability: collect
    using: script
    config:
      file: scripts/collect.py

  # ── 第二步：LLM 精选 ──
  - id: digest
    runner: gha
    depends: [collect]
    capability: process
    using: llm
    config:
      model: "Qwen/Qwen2.5-32B-Instruct"
      api_url: "https://api.siliconflow.cn/v1/chat/completions"

  # ── 第三步：存入数据桥 ──
  - id: store
    runner: gha
    depends: [digest]
    capability: store
    using: git

  # ── 第四步：渲染发信 ──
  - id: send
    runner: gha
    depends: [digest]
    capability: process
    using: script
    config:
      file: scripts/send.py
