name: ai-briefing
trigger:
  schedule: "0 23 * * *"        # UTC 23:00 = 北京 07:00
  workflow_dispatch:
    inputs:
      mode:
        description: "模式: daily/weekly/monthly"
        default: "daily"

steps:
  # ── 第一步：检测模式 ──
  - id: detect
    runner: gha
    capability: detect
    using: script
    config:
      file: scripts/detect-mode.sh

  # ── 第二步：采集 ──
  - id: collect
    runner: gha
    depends: [detect]
    capability: collect
    using: script
    config:
      file: scripts/collect.py

  # ── 第三步：LLM 精选 ──
  - id: digest
    runner: gha
    depends: [collect]
    capability: process
    using: script
    config:
      file: scripts/digest.py

  # ── 第四步：同步到坚果云 ──
  - id: sync
    runner: gha
    depends: [digest]
    capability: store
    using: rclone
    config:
      remote: "jianguoyun"
      type: "webdav"
      url: "https://dav.jianguoyun.com/dav/"
      vendor: "other"
      user_secret: "RCLONE_USER"
      pass_secret: "RCLONE_PASS"
      source: "data/"
      target: "notebook/学/AI简报/"

  # ── 第五步：邮件通知 ──
  - id: notify
    runner: gha
    depends: [digest]
    optional: true
    capability: notify
    using: email
    config:
      to: "james.sun@qq.com"
      subject: "✅ AI 简报"
