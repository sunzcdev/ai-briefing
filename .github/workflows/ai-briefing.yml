name: ai-briefing

on:
  schedule:
    - cron: '0 23 * * *'     # 北京 07:00
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: daily/weekly/monthly'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read
  actions: write

env:
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  AI_BRIEFING_TO: ${{ secrets.EMAIL_TO }}
  LLM_KEY: ${{ secrets.LLM_KEY }}
  ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
  AI_BRIEFING_DATA: ${{ github.workspace }}/data
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: '465'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: mkdir -p data

      # ═══ 一键采集 → 精选 → 邮件 ═══
      - name: collect-and-digest
        run: |
          pip install -q -r requirements.txt 2>/dev/null || true
          MODE="${{ inputs.mode || 'daily' }}"
          python3 main.py "$MODE"

      # ═══ 同步坚果云 ═══
      - name: sync
        continue-on-error: true
        env:
          RCLONE_CONFIG_JIANGUOYUN_TYPE: webdav
          RCLONE_CONFIG_JIANGUOYUN_URL: https://dav.jianguoyun.com/dav/
          RCLONE_CONFIG_JIANGUOYUN_VENDOR: other
          RCLONE_CONFIG_JIANGUOYUN_USER: ${{ secrets.RCLONE_USER }}
          RCLONE_PLAIN_PASS: ${{ secrets.RCLONE_PASS }}
        run: |
          which rclone >/dev/null 2>&1 || (curl -s https://rclone.org/install.sh | sudo bash)
          export RCLONE_CONFIG_JIANGUOYUN_PASS=$(rclone obscure "$RCLONE_PLAIN_PASS")
          rclone copy data/ jianguoyun:notebook/学/AI/AI简报/

      # ═══ 上传 artifact ═══
      - name: probe-and-upload
        id: probe
        run: |
          FOUND=false
          for f in data/*.json; do
            [ -f "$f" ] && [ -s "$f" ] && FOUND=true && break
          done
          echo "has_output=$FOUND" >> $GITHUB_OUTPUT
          echo "  有数据 = $FOUND"

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.has_output == 'true'
        with:
          name: ai-brief-${{ github.run_id }}
          path: data/
          retention-days: 3
