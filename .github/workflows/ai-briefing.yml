name: ai-briefing

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: daily/weekly/monthly'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

env:
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  LLM_KEY: ${{ secrets.LLM_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: mkdir -p data

      # ═══ 第一步：检测模式 ═══
      - name: detect · detect/script
        id: detect
        run: |
          bash scripts/detect-mode.sh

      # ═══ 第二步：采集 ═══
      - name: collect · collect/script
        id: collect
        env:
          MODE: ${{ steps.detect.outputs.mode }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          pip install -q -r requirements.txt 2>/dev/null || true
          python3 scripts/collect.py "$MODE"

      # ═══ 第三步：LLM 精选 ═══
      - name: digest · process/script
        id: digest
        env:
          SYSTEM_PROMPT: ${{ vars.SYSTEM_PROMPT }}
        run: |
          pip install -q -r requirements.txt 2>/dev/null || true
          python3 scripts/digest.py

      # ═══ 第四步：同步坚果云 ═══
      - name: sync · store/rclone
        id: sync
        continue-on-error: true
        env:
          RCLONE_CONFIG_JIANGUOYUN_TYPE: webdav
          RCLONE_CONFIG_JIANGUOYUN_URL: https://dav.jianguoyun.com/dav/
          RCLONE_CONFIG_JIANGUOYUN_VENDOR: other
          RCLONE_CONFIG_JIANGUOYUN_USER: ${{ secrets.RCLONE_USER }}
          RCLONE_PLAIN_PASS: ${{ secrets.RCLONE_PASS }}
        run: |
          which rclone >/dev/null 2>&1 || (curl -s https://rclone.org/install.sh | sudo bash)
          export RCLONE_CONFIG_JIANGUOYUN_PASS=$(rclone obscure "$RCLONE_PLAIN_PASS")
          rclone copy "data/" "jianguoyun:notebook/学/AI简报/" --progress
          echo "  ✓ rclone: data/ → jianguoyun:notebook/学/AI简报/"

      # ═══ 第五步：邮件通知 ═══
      - name: notify · notify/email
        id: notify
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt 2>/dev/null || true
          for i in 1 2 3; do
            python3 scripts/send.py && break
            echo "[lwf] 发信失败 (attempt $i), 等待 10s 后重试..." >&2
            sleep 10
          done
