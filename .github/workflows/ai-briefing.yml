name: AI 简报

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: daily/weekly/monthly'
        required: true
        default: 'weekly'
        type: choice
        options: [daily, weekly, monthly]

concurrency:
  group: ai-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CURATOR_API_KEY: ${{ secrets.CURATOR_API_KEY }}
      QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
      AI_BRIEFING_TO: ${{ secrets.AI_BRIEFING_TO || 'sunzcdev@gmail.com' }}
      AI_BRIEFING_SKIP_INTERNALIZATION: '1'
      AI_BRIEFING_DATA: ${{ github.workspace }}/data

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt

      - name: 确定模式（优先级 月报 > 周报 > 日报）
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            DOM=$(date +%d)
            DOW=$(date +%u)
            if [[ "$DOM" == "01" ]]; then
              echo "mode=monthly" >> $GITHUB_OUTPUT
            elif [[ "$DOW" == "1" ]]; then
              echo "mode=weekly" >> $GITHUB_OUTPUT
            else
              echo "mode=daily" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 运行采集 → LLM 精选 → 渲染 → 发信
        run: python main.py ${{ steps.mode.outputs.mode }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-briefing-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: data/*.html
          retention-days: 30
