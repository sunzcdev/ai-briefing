name: ai-briefing

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: daily/weekly/monthly'
        required: true
        default: 'weekly'
        type: choice
        options: [daily, weekly, monthly]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BRIDGE_REPO || github.repository }}
          token: ${{ secrets.BRIDGE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: mkdir -p data

      - name: detect · detect/script
        id: detect
        run: |
          bash scripts/detect-mode.sh

      - name: collect · collect/script
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          python3 scripts/collect.py ${{ steps.detect.outputs.mode }}

      - name: digest · process/llm
        id: digest
        run: |
          mkdir -p ${{ github.workspace }}/data
          cat > /tmp/prompt.txt << 'LWF_PROMPT'
你是 AI 领域资深编辑。从候选项目中挑出 7 个最值得关注的优质项目，从候选新闻中挑出 3 个最重要热点，每项用一句话中文点评。
LWF_PROMPT
          curl -s -o "${{ github.workspace }}/data/digest.json" \
            "https://api.siliconflow.cn/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.LLM_KEY }}" \
            -d "$(jq -n --arg p "$(cat /tmp/prompt.txt)" '{model:"Qwen/Qwen2.5-32B-Instruct",messages:[{role:"user",content:$p}]}')"

      - name: store · store/git
        id: store
        run: |
          git config user.name "lwf-bot"
          git config user.email "lwf-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "ai-briefing update" && git push)

      - name: send · process/script
        id: send
        env:
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          python3 scripts/send.py 

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-briefing-${{ github.run_id }}
          path: data/
          retention-days: 3