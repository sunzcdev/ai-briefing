name: ai-brief

on:
  schedule:
    - cron: '0 23 * * *'     # 北京 07:00
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: daily/weekly/monthly'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: mkdir -p data

      - name: collect-process · process/script
        id: collect-process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          AI_BRIEFING_DATA: ${{ github.workspace }}/data
          AI_BRIEFING_TO: ${{ secrets.AI_BRIEFING_TO || 'sunzcdev@gmail.com' }}
          QQ_EMAIL: zhenchao@qq.com
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
        run: |
          MODE="${{ inputs.mode || 'daily' }}"
          pip install -r requirements.txt -q 2>/dev/null || true
          python3 main.py "$MODE"

      - name: sync · store/rclone
        env:
          RCLONE_CONFIG_JIANGUOYUN_TYPE: webdav
          RCLONE_CONFIG_JIANGUOYUN_VENDOR: other
          RCLONE_CONFIG_JIANGUOYUN_URL: https://dav.jianguoyun.com/dav/
          RCLONE_CONFIG_JIANGUOYUN_USER: ${{ secrets.RCLONE_USER }}
          RCLONE_PLAIN_PASS: ${{ secrets.RCLONE_PASS }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          export RCLONE_CONFIG_JIANGUOYUN_PASS=$(rclone obscure "$RCLONE_PLAIN_PASS")
          rclone copy data/ jianguoyun:notebook/学/AI简报/

      - name: probe-output
        id: probe-output
        run: |
          FOUND=false
          for f in ${{ github.workspace }}/data/*.json; do
            [ -f "$f" ] && [ -s "$f" ] && FOUND=true && break
          done
          if [ "$FOUND" = true ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            echo "  有数据 → 上传 artifact"
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
            echo "  无数据 → 跳过 artifact"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.probe-output.outputs.has_output == 'true'
        with:
          name: ai-brief-${{ github.run_id }}
          path: data/
          retention-days: 3
