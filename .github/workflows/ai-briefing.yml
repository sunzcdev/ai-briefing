name: ai-briefing

on:
  schedule:
    - cron: '0 23 * * *'     # 北京 07:00
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: daily/weekly/monthly'
        required: true
        default: 'weekly'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run main.py
        id: run-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURATOR_LLM: ${{ secrets.CURATOR_LLM }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          AI_BRIEFING_TO: ${{ secrets.AI_BRIEFING_TO || 'sunzcdev@gmail.com' }}
        run: |
          MODE="${{ inputs.mode || 'daily' }}"
          pip install -r requirements.txt -q 2>/dev/null || true
          python3 main.py "$MODE"

      - name: sync · store/rclone
        env:
          RCLONE_CONFIG_JIANGUOYUN_TYPE: webdav
          RCLONE_CONFIG_JIANGUOYUN_VENDOR: other
          RCLONE_CONFIG_JIANGUOYUN_URL: https://dav.jianguoyun.com/dav/
          RCLONE_CONFIG_JIANGUOYUN_USER: ${{ secrets.RCLONE_USER }}
          RCLONE_CONFIG_JIANGUOYUN_PASS: ${{ secrets.RCLONE_PASS }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone copy ~/.hermes/data/ai_briefing/ jianguoyun:notebook/学/AI简报/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-briefing-${{ github.run_id }}
          path: ~/.hermes/data/ai_briefing/
          retention-days: 3
